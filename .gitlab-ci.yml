mat_macos:
  stage: prepare
  tags:
    - linux
  script:
    - wget -O - https://cdn02.moecube.com:444/premake5-built/premake-5.0.0-beta8-macosx.tar.gz | tar zfx -
    - chmod +x premake5
  artifacts:
    paths:
      - premake5

mat_windows:
  stage: prepare
  tags:
    - linux
  script:
    # premake5.exe
    - wget https://cdn02.moecube.com:444/premake5-built/premake-5.0.0-beta8-windows.zip
    - 7z x -y premake-5.0.0-beta8-windows.zip
    # nasm.exe
    - wget -O nasm-3.02-win64.zip https://mat-cacher.moenext.com/https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip?sha256sum=161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7
    - 7z x -y nasm-3.02-win64.zip
    - cp nasm-3.02/nasm.exe .
  artifacts:
    paths:
      - premake5.exe
      - nasm.exe

._exec_build:
  stage: build
  variables:
    GIT_STRATEGY: 'clone'

exec_windows:
  extends: ._exec_build
  tags:
    - vs
  variables:
    USE_SIMD: 'sse2'
    VS2026_WIN7_SUPPORT: '1'
  dependencies:
    - mat_common
    - mat_windows
    - mat_submodules
  script:
    - bash -c 'cp -rf premake/* . ; cp -rf resource/* .'
    - bash -c 'cp event/msvc-event-config.h event/include/event2/event-config.h' # TODO: prepare-event.bat ?
    - bash -c 'cp event/WIN32-Code/nmake/evconfig-private.h event/include/evconfig-private.h'
    - copy nasm.exe C:\Windows\
    - '.\premake5.exe vs2026'
    - cmd /c '"C:\Program Files\Microsoft Visual Studio\18\Community\MSBuild\Current\Bin\msbuild.exe" build\YGOPro.slnx /m /p:Configuration=Release /p:Platform=x64'
    - copy bin\release\x64\ygopro.exe .
  artifacts:
    paths:
      - ygopro.exe

.exec_unix:
  extends: ._exec_build
  variables:
    BUILD_FREETYPE: '1'
    BUILD_SQLITE: '1'
    BUILD_IRRLICHT: '1'
    BUILD_EVENT: '1'
    BUILD_OPUS_VORBIS: '1'
    AUDIO_LIB: 'miniaudio'
    MINIAUDIO_SUPPORT_OPUS_VORBIS: '1'
    BUILD_JPEG: '1'
    BUILD_PNG: '1'
    BUILD_ZLIB: '1'
    BUILD_LZMA: '1'
  before_script:
    - ./.ci/configure-libevent.sh

exec_linux:
  extends: .exec_unix
  tags:
    - linux
  image: git-registry.moenext.com/mycard/docker-ygopro-builder:latest
  dependencies:
    - mat_common
    #- mat_linux
    - mat_submodules
  script:
    - apt update; apt -y install nasm
    - ./.ci/configure-audio.sh
    - premake5 gmake
    - cd build
    - make config=release -j$(nproc)
    - cd ..
    - mv bin/release/YGOPro ./ygopro
    - strip ygopro
  artifacts:
    paths:
      - ygopro

.exec_macos_platform:
  extends: .exec_unix
  dependencies:
    - mat_macos
    - mat_common
    - mat_submodules
  script: ./.ci/exec-macos-platform.sh
  artifacts:
    paths:
      - ygopro-platforms

exec_macos_platform_x86:
  extends: .exec_macos_platform
  tags:
    - macos
      
exec_macos_platform_m1:
  extends: .exec_macos_platform
  tags:
    - macos-m1

exec_macos:
  stage: combine
  tags:
    - macos
  dependencies:
    - exec_macos_platform_x86
    - exec_macos_platform_m1
  script:
    - mkdir -p ygopro.app/Contents/MacOS ygopro.app/Contents/Frameworks;
    - lipo -create -output ygopro.app/Contents/MacOS/ygopro $(ls -1 ygopro-platforms/ygopro-platform-*);
    - mkdir ygopro.app/Contents/Resources;
    - mv resource/gframe/ygopro.icns ygopro.app/Contents/Resources/Icon.icns;
    - defaults write "$PWD/ygopro.app/Contents/Info.plist" "CFBundleIconFile" "Icon.icns";
    - defaults write "$PWD/ygopro.app/Contents/Info.plist" "CFBundleIdentifier" "moe.mycard.ygopro";

  artifacts:
    paths:
      - ygopro.app

