    - gitlabci

assets_windows:
  stage: prepare
  tags:
    - linux
  script:
    - apt update; apt -y install wget p7zip-full
    - wget https://cdn02.moecube.com:444/windbot-mc/WindBot.7z
    - 7z x -y WindBot.7z
  artifacts:
    paths:
      - bot.conf
      - WindBot
      - Bot.exe
  only:
    - tags
    - gitlabci

