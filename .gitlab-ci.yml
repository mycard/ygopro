stages:
  - prepare
  - build
  - combine
  - pack
  - deploy

variables:
  GIT_DEPTH: "1"

mat_common:
  stage: prepare
  tags: 
    - linux
  script:
    # lua
    - wget -O lua.tar.gz https://mat-cacher.moenext.com/https://www.lua.org/ftp/lua-5.4.8.tar.gz
    - echo '4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae  lua.tar.gz' | sha256sum -c -
    - tar zxf lua.tar.gz
    - mv lua-5.4.8 lua
    # sqlite3
    - wget -O sqlite.tar.gz https://mat-cacher.moenext.com/https://www.sqlite.org/2026/sqlite-autoconf-3530300.tar.gz
    - echo 'c917d7db16648ec95f714974ace5e5dcf46b7dc70e26600a0a102a3141125db0  sqlite.tar.gz' | sha256sum -c -
    - tar zxf sqlite.tar.gz
    - mv sqlite-autoconf-3530300 sqlite3
    # freetype
    #- wget -O - https://mat-cacher.moenext.com/https://downloads.sourceforge.net/freetype/freetype-2.14.3.tar.gz | tar zfx -
    #- mv freetype-2.14.3 freetype
    # event
    - wget -O libevent.tar.gz https://mat-cacher.moenext.com/https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz
    - echo 'f7e9383b8c0baa81b687e5b5eecc01beefaf1b19b64151d95ed61647fe7a315c  libevent.tar.gz' | sha256sum -c -
    - tar zxf libevent.tar.gz
    - mv libevent-2.1.13-stable event
    # irrlicht
    - ./.ci/prepare-irrlicht.sh
    # lzma
    - wget -O xz.tar.gz https://mat-cacher.moenext.com/https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.gz
    - echo '3d3a1b973af218114f4f889bbaa2f4c037deaae0c8e815eec381c3d546b974a0  xz.tar.gz' | sha256sum -c -
    - tar zxf xz.tar.gz
    - mv xz-5.8.3 lzma
    # zlib
    - wget -O zlib.tar.gz https://mat-cacher.moenext.com/https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
    - echo 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  zlib.tar.gz' | sha256sum -c -
    - tar zxf zlib.tar.gz
    - mv zlib-1.3.2 zlib
    # miniaudio
    #- ./.ci/prepare-miniaudio.sh
    # premake
    - cp -rf premake/* .;
  artifacts:
    paths:
      - lua
      #- freetype
      - sqlite3
      - event
      - irrlicht
      - lzma
      - zlib
      #- miniaudio

mat_submodules:
  stage: prepare
  tags: 
    - linux
  script:
    - rm -rf ocgcore script
    - mkdir ocgcore script
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git submodule update --init
  artifacts:
    paths:
      - ocgcore
      - script

